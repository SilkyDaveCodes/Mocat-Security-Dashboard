[project]
name = "homesoc"
version = "0.1.0"
description = "Personal network-security agent and app for home Windows PCs"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "smoke: end-to-end demo path (fake malware -> alert -> quarantine -> undo); tests/test_smoke.py",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
