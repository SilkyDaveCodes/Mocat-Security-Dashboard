# HomeSOC lab DNS (CLAUDE.md §8, §9) -- host-only network 192.168.56.0/24 only.
#
# This config is DEMO-ONLY. It runs dnsmasq on the lab Ubuntu VM (192.168.56.20) so that
# every DNS lookup made inside the isolated lab resolves to the lab C2 address. That lets
# the harmless fake-malware simulator "resolve" random-looking (DGA-style) domains without
# any traffic ever leaving the host-only network.
#
# Run on the lab VM:   sudo dnsmasq -C lab/dnsmasq.conf

# Only answer on the lab interface / lab address. Never serve DNS to the outside world.
listen-address=192.168.56.20
bind-interfaces

# Do not read /etc/resolv.conf and do not forward anything upstream: the lab is sealed.
no-resolv
no-hosts

# Wildcard: resolve ALL names to the lab C2 address. The "/#/" form matches every domain,
# so any DGA-looking lookup the simulator makes returns 192.168.56.20.
address=/#/192.168.56.20
